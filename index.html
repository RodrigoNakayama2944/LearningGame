<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Quest — Learn CSS by Playing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1 class="logo">&lt;CSS Quest/&gt;</h1>
      <span class="subtitle" data-i18n="subtitle">Learn CSS by Playing</span>
    </div>
    <nav class="level-nav" id="levelNav"></nav>
    <div class="header-right">
      <div class="language-picker">
        <button class="btn-language" id="btnLanguage" aria-haspopup="true" aria-expanded="false" title="Language">English</button>
        <div class="language-menu hidden" id="languageMenu" role="menu"></div>
      </div>
      <span class="progress-text" id="progressText">0 / 0</span>
    </div>
  </header>

  <main class="main">
    <section class="challenge-panel">
      <div class="challenge-header">
        <span class="level-badge" id="levelBadge">Level 1</span>
        <h2 class="challenge-title" id="challengeTitle"></h2>
      </div>
      <p class="challenge-description" id="challengeDescription"></p>
      <div class="hint-box" id="hintBox">
        <span class="hint-label" data-i18n="hintLabel">Hint:</span>
        <p class="hint-text" id="hintText"></p>
      </div>
      <div class="editor-section">
        <div class="editor-header">
          <span class="editor-tab active">style.css</span>
          <span class="editor-label" data-i18n="editorLabel">Write your CSS here</span>
        </div>
        <div class="editor-container" id="editorContainer">
          <div class="line-numbers" id="lineNumbers"></div>
          <div class="editor-wrapper">
            <textarea class="editor-input" id="editorInput" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
          </div>
        </div>
      </div>
      <div class="challenge-actions">
        <button class="btn btn-check" id="btnCheck" data-i18n="checkAnswer">Check Answer</button>
        <button class="btn btn-reset" id="btnReset" data-i18n="reset">Reset</button>
        <button class="btn btn-hint" id="btnHint" data-i18n="showHint">Show Hint</button>
        <button class="btn btn-tags" id="btnTags" data-i18n="cssTags">CSS Tags</button>
      </div>
      <div class="explanation-panel hidden" id="explanationPanel">
        <div class="explanation-header">
          <span class="explanation-label" data-i18n="howItWorks">How it works:</span>
          <div class="explanation-actions">
            <button class="explanation-btn" id="btnCollapseExplanation" title="Shrink the explanation" aria-label="Shrink the explanation">&#9662;</button>
            <button class="explanation-btn" id="btnCloseExplanation" title="Remove the explanation" aria-label="Remove the explanation">&#10005;</button>
          </div>
        </div>
        <div class="explanation-body" id="explanationBody"></div>
      </div>
    </section>

    <div class="tags-modal hidden" id="tagsModal">
      <div class="tags-content">
        <div class="tags-header">
          <h3 data-i18n="tagsTitle">CSS Tags</h3>
          <button class="tags-close" id="tagsClose">&times;</button>
        </div>
        <p class="tags-intro" data-i18n="tagsIntro">Click a tag to see what it does, the most common values and an example.</p>
        <div class="tags-body" id="tagsBody"></div>
      </div>
    </div>

    <section class="preview-panel">
      <div class="preview-header">
        <span class="preview-label" data-i18n="livePreview">Live Preview</span>
        <span class="preview-status" id="previewStatus" data-i18n="updating">Updating...</span>
      </div>
      <div class="preview-container">
        <div class="preview-frame-wrapper">
          <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
        <div class="target-wrapper" id="targetWrapper">
          <span class="target-label" data-i18n="target">Target</span>
          <div class="target-frame-wrapper">
            <iframe id="targetFrame" sandbox="allow-scripts allow-same-origin"></iframe>
          </div>
        </div>
      </div>
      <div class="result-banner hidden" id="resultBanner">
        <div class="result-heading">
          <span class="result-icon" id="resultIcon"></span>
          <span class="result-text" id="resultText"></span>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
